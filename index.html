<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>KKN 10 MEKARLAKSANA</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700;800&family=Lato:wght@400;700;900&display=swap" rel="stylesheet" />
<style>
:root {
  --cream: #f4efe6;
  --cream-2: #eae2d3;
  --brown: #3e2c23;
  --brown-soft: #5a4636;
  --green: #2f4a3c;
  --green-soft: #4c6b57;
  --gold: #c9a227;
  --gold-soft: #e0c468;
  --shadow: 0 20px 50px rgba(62, 44, 35, 0.25);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  background: var(--cream);
  color: var(--brown);
  font-family: "Lato", sans-serif;
  overflow: hidden;
}

#app {
  position: relative;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  background:
    radial-gradient(circle at 15% 20%, rgba(201, 162, 39, 0.1), transparent 45%),
    radial-gradient(circle at 85% 80%, rgba(47, 74, 60, 0.12), transparent 50%),
    var(--cream);
}

.eyebrow {
  font-family: "Lato", sans-serif;
  font-weight: 900;
  letter-spacing: 0.35em;
  text-transform: uppercase;
  font-size: 0.72rem;
  color: var(--green-soft);
}

h1, h2, h3 { font-family: "Playfair Display", serif; }

.top-title {
  position: fixed;
  top: 18px;
  left: 50%;
  transform: translateX(-50%);
  font-family: "Playfair Display", serif;
  font-weight: 700;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--brown);
  font-size: clamp(0.85rem, 2vw, 1.25rem);
  z-index: 45;
  text-align: center;
  white-space: nowrap;
  text-shadow: 0 1px 0 rgba(255, 255, 255, 0.4);
}

@media (max-width: 640px) {
  .top-title { font-size: 0.72rem; letter-spacing: 0.12em; }
}

.slides {
  position: relative;
  width: 100%;
  height: 100%;
}

.slide {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 6vh 6vw;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease;
}
.slide.active {
  opacity: 1;
  pointer-events: auto;
}

.group-photo-ring {
  position: relative;
  width: min(46vw, 320px);
  height: min(46vw, 320px);
  border-radius: 50%;
  border: 3px solid var(--gold);
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 2rem;
  background: linear-gradient(155deg, var(--green), var(--brown));
  box-shadow: var(--shadow);
  animation: groupIntro 1.1s cubic-bezier(0.2, 0.8, 0.25, 1);
  overflow: hidden;
}
.group-photo-ring span {
  font-family: "Playfair Display", serif;
  color: var(--cream);
  font-size: min(6vw, 3rem);
  font-weight: 700;
}
.group-photo-ring img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
@keyframes groupIntro {
  0% { opacity: 0; transform: scale(0.6) rotate(-8deg); }
  100% { opacity: 1; transform: scale(1) rotate(0deg); }
}

.slide-group h1 {
  font-size: clamp(1.9rem, 4.5vw, 3.2rem);
  color: var(--brown);
  line-height: 1.15;
  max-width: 16ch;
}
.slide-group p.desc {
  max-width: 52ch;
  margin-top: 1rem;
  color: var(--brown-soft);
  font-size: 1.05rem;
  line-height: 1.6;
}

.member-content {
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: center;
  gap: clamp(1.6rem, 4vw, 3.2rem);
  max-width: 920px;
  width: 100%;
}
.member-info {
  text-align: left;
  max-width: 440px;
}
.member-avatar {
  width: min(34vw, 220px);
  aspect-ratio: 3 / 4;
  height: auto;
  border-radius: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: var(--shadow);
  border: 4px solid var(--cream);
  outline: 2px solid var(--gold);
  outline-offset: 6px;
  flex-shrink: 0;
  overflow: hidden;
  will-change: transform, opacity;
}
.member-avatar span {
  font-family: "Playfair Display", serif;
  font-size: min(9vw, 4.2rem);
  font-weight: 700;
  color: var(--cream);
}

.member-avatar img,
.final-photo img,
.tray-avatar img,
.gather-clone img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: top center;
  border-radius: inherit;
  display: block;
}

/* ===== FLIP KARTU KESELURUHAN (bingkai + foto) ===== */
.member-content {
  perspective: 1200px;
}
.member-avatar.enter {
  animation: cardFlip 650ms cubic-bezier(0.25, 0.46, 0.45, 0.94) both;
}
@keyframes cardFlip {
  0% {
    transform: rotateY(-95deg) scale(0.65);
    opacity: 0;
  }
  50% {
    transform: rotateY(-10deg) scale(1.03);
    opacity: 1;
  }
  100% {
    transform: rotateY(0deg) scale(1);
    opacity: 1;
  }
}

.member-info .eyebrow { display: block; }
.member-role {
  font-family: "Lato", sans-serif;
  font-weight: 900;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: var(--gold);
  font-size: 0.8rem;
  margin-top: 0.5rem;
  margin-bottom: 0.4rem;
}
.member-name {
  font-size: clamp(1.6rem, 4vw, 2.6rem);
  color: var(--brown);
  margin-bottom: 0.6rem;
  min-height: 1.2em;
}
.member-desc {
  max-width: 48ch;
  color: var(--brown-soft);
  line-height: 1.6;
  opacity: 0;
  transform: translateY(8px);
  transition: opacity 0.5s ease, transform 0.5s ease;
}
.member-desc.show {
  opacity: 1;
  transform: translateY(0);
}

@media (max-width: 760px) {
  .member-content {
    flex-direction: column;
    text-align: center;
  }
  .member-info {
    text-align: center;
    max-width: 90vw;
  }
  .member-desc {
    max-width: 38ch;
    margin-left: auto;
    margin-right: auto;
  }
}

.member-name.typing::after {
  content: "|";
  margin-left: 2px;
  color: var(--gold);
  animation: blinkCursor 0.8s steps(1) infinite;
}
@keyframes blinkCursor {
  0%, 49% { opacity: 1; }
  50%, 100% { opacity: 0; }
}

.final-title {
  font-size: clamp(1.6rem, 4vw, 2.6rem);
  color: var(--brown);
  margin-bottom: 2.2rem;
}
.final-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: clamp(10px, 2vw, 22px);
  max-width: 92vw;
}
.final-photo {
  width: clamp(58px, 9vw, 96px);
  height: clamp(58px, 9vw, 96px);
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 8px 18px rgba(62, 44, 35, 0.22);
  border: 2px solid var(--cream);
  opacity: 0;
  overflow: hidden;
  transition: opacity 0.35s ease;
}
.final-photo span {
  font-family: "Playfair Display", serif;
  color: var(--cream);
  font-weight: 700;
  font-size: clamp(1rem, 2.2vw, 1.5rem);
}
.final-caption {
  margin-top: 1.6rem;
  color: var(--green-soft);
  font-weight: 700;
  letter-spacing: 0.05em;
}

.gather-clone {
  position: fixed;
  z-index: 60;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 8px 18px rgba(62, 44, 35, 0.3);
  border: 2px solid var(--cream);
  overflow: hidden;
  pointer-events: none;
}
.gather-clone span {
  font-family: "Playfair Display", serif;
  color: var(--cream);
  font-weight: 700;
}

.collected-tray {
  position: fixed;
  top: 22px;
  right: 22px;
  display: flex;
  gap: 8px;
  z-index: 40;
  opacity: 0;
  pointer-events: none;
}
.tray-avatar {
  width: 38px;
  height: 38px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 10px rgba(62, 44, 35, 0.25);
  border: 2px solid var(--cream);
  opacity: 0;
  overflow: hidden;
  transform: scale(0.5);
  transition: opacity 0.4s ease, transform 0.4s ease;
}
.tray-avatar.show {
  opacity: 1;
  transform: scale(1);
}
.tray-avatar span {
  font-family: "Playfair Display", serif;
  color: var(--cream);
  font-weight: 700;
  font-size: 0.85rem;
}
.tray-avatar.hide-for-gather {
  opacity: 0;
  transform: scale(0.5);
}

.flash-effect {
  position: fixed;
  inset: 0;
  background: #fffdf6;
  opacity: 0;
  z-index: 90;
  pointer-events: none;
  transition: opacity 0.08s ease-out;
}
.flash-effect.active {
  opacity: 0.92;
  transition: opacity 0.03s ease-in;
}

.nav-btn {
  position: fixed;
  top: 50%;
  transform: translateY(-50%);
  background: transparent;
  color: var(--brown-soft);
  border: none;
  width: auto;
  height: auto;
  border-radius: 0;
  font-size: 2.4rem;
  font-family: "Playfair Display", serif;
  line-height: 1;
  cursor: pointer;
  z-index: 50;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0.2rem 0.6rem;
  transition: color 0.2s ease, transform 0.15s ease, opacity 0.2s ease;
}
.nav-btn:hover { color: var(--brown); transform: translateY(-50%) scale(1.15); }
.nav-btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.nav-btn:disabled { opacity: 0.15; cursor: default; }
.nav-btn.prev { left: 12px; }
.nav-btn.next { right: 12px; }

.cta-btn {
  margin-top: 2.2rem;
  background: var(--brown);
  color: var(--cream);
  border: none;
  padding: 0.9rem 2rem;
  border-radius: 999px;
  font-family: "Lato", sans-serif;
  font-weight: 900;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  font-size: 0.85rem;
  cursor: pointer;
  box-shadow: 0 12px 24px rgba(62, 44, 35, 0.28);
  transition: transform 0.15s ease, background 0.15s ease;
}
.cta-btn:hover { background: var(--green); transform: translateY(-2px); }
.cta-btn:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }

.progress-dots {
  position: fixed;
  bottom: 22px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 9px;
  z-index: 50;
}
.dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: var(--brown-soft);
  opacity: 0.25;
  cursor: pointer;
  border: none;
  transition: opacity 0.2s ease, transform 0.2s ease;
}
.dot.active {
  opacity: 0.9;
  transform: scale(1.35);
  background: var(--gold);
}
.dot:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

@media (max-width: 640px) {
  .nav-btn { width: 40px; height: 40px; }
}

@media (prefers-reduced-motion: reduce) {
  * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}
</style>
<base target="_blank">
</head>
<body>
<div id="app">
  <div class="top-title">KKN 10 Mekarlaksana</div>

  <div class="collected-tray" id="tray" aria-hidden="true"></div>

  <div class="slides" id="slides">
    <section class="slide slide-group active" data-type="group" id="slide-0">
      <p class="eyebrow">Kuliah Kerja Nyata</p>
      <div class="group-photo-ring">
        <img src="foto/ok1.png" alt="Logo Kelompok KKN 10" />
      </div>
      <h1>Kelompok KKN 10<br />Desa Mekarlaksana</h1>
      <p class="desc">
        Penguatan Ketahanan Pangan Dan Ekonomi Desa Melalui Hilirisasi
        Produk Lokal Menuju Desa Mandiri Berkelanjutan
      </p>
      <button class="cta-btn" id="startBtn">Let's Goooo!!!!!</button>
    </section>

    <section class="slide slide-final" data-type="final" id="slide-final">
      <p class="eyebrow">One Team, One Goals</p>
      <h2 class="final-title">Kelompok KKN 10 Desa Mekarlaksana</h2>
      <div class="final-row" id="finalRow"></div>
      <p class="final-caption">Terima kasih telah mengenal kami!</p>
    </section>
  </div>

  <div class="flash-effect" id="flashEffect" aria-hidden="true"></div>

  <button class="nav-btn prev" id="prevBtn" aria-label="Sebelumnya">&#8249;</button>
  <button class="nav-btn next" id="nextBtn" aria-label="Berikutnya">&#8250;</button>
  <div class="progress-dots" id="dots"></div>
</div>

<script>
(function () {
  const members = [
    { role: "Ketua", name: "Adriana Putra Pratama Kusumah", photo: "foto/4.png", desc: "Don't Die Poor" },
    { role: "Wakil Ketua", name: "Meisya Amelia Putri", photo: "foto/5.png", desc: "Purpose Driven" },
    { role: "Sekretaris 1", name: "Fiska Noerina Hidayat", photo: "foto/9.png", desc: "Silent Impact" },
    { role: "Sekretaris 2", name: "Ilham Ramdan", photo: "foto/10.png", desc: "Sedang Offline" },
    { role: "Bendahara", name: "Verina lutfiyah", photo: "foto/11.png", desc: "Endless Hope" },
    { role: "Divisi Acara", name: "Fahmi Fagrezi", photo: "foto/7.png", desc: "Kerja Cerdas" },
    { role: "Divisi Acara", name: "Alvis Saputra", photo: "foto/6.png", desc: "Stay Calm" },
    { role: "Divisi Acara", name: "Faisal Hafiz Al-Fatah", photo: "foto/8.png", desc: "See U On Top" },
    { role: "Divisi Publikasi Desain Dokumentasi", name: "Sabilal Hafiana Putra", photo: "foto/1.png", desc: "Hade Goreng Ku Baso" },
    { role: "Divisi Publikasi Desain Dokumentasi", name: "Ahmad Fauzi Shalihuddin", photo: "foto/3.png", desc: "Satu Momen,Seribu Cerita" },
    { role: "Divisi Publikasi Desain Dokumentasi", name: "Sri Wahyuni", photo: "foto/2.png", desc: "Terbaik" },
    { role: "Divisi Konsumsi", name: "Muhammad Rival ", photo: "foto/13.png", desc: "Pelan Tapi Pasti" },
    { role: "Divisi Konsumsi", name: "Fatharani Sausan Sani", photo: "foto/12.png", desc: "Growing With Joy" },
    { role: "Divisi Hubungan Masyarakat", name: "Ibnu Ibad Al-Randi", photo: "foto/14.png", desc: "Adab Mendahului Kata" },
    { role: "Divisi Hubungan Masyarakat", name: "Ririn Dwi Ariyanti", photo: "foto/15.png", desc: "Be Better" },
    { role: "Divisi Logistik", name: "Ferdiansyah", photo: "foto/16.png", desc: "Terlalu Banyak Ilusi Sehingga Lupa Aksi" },
    { role: "Divisi Logistik", name: "Andrew Clementinard", photo: "foto/17.png", desc: "Ubar Sebel" },
  ];

  const gradients = [
    ["#C9A227", "#E0C468"],
    ["#2F4A3C", "#4C6B57"],
    ["#3E2C23", "#5A4636"],
  ];
  function gradientFor(i) {
    const g = gradients[i % gradients.length];
    return `linear-gradient(155deg, ${g[0]}, ${g[1]})`;
  }
  function initialsOf(name) {
    return name
      .trim()
      .split(/\s+/)
      .slice(0, 2)
      .map((w) => w[0])
      .join("")
      .toUpperCase();
  }
  function avatarContentHTML(i) {
    const m = members[i];
    if (m.photo && m.photo.trim() !== "") {
      return `<img src="${m.photo}" alt="Foto ${m.name}">`;
    }
    return `<span>${initialsOf(m.name)}</span>`;
  }

  const slidesEl = document.getElementById("slides");
  const finalSlide = document.getElementById("slide-final");

  members.forEach((m, i) => {
    const section = document.createElement("section");
    section.className = "slide slide-member";
    section.dataset.type = "member";
    section.dataset.index = i;
    section.id = "slide-m" + i;
    section.innerHTML = `
      <div class="member-content">
        <div class="member-avatar" style="background:${gradientFor(i)}">
          ${avatarContentHTML(i)}
        </div>
        <div class="member-info">
          <p class="eyebrow">Perkenalan Pengurus</p>
          <p class="member-role">${m.role}</p>
          <h3 class="member-name" id="name-${i}"></h3>
          <p class="member-desc" id="desc-${i}">${m.desc}</p>
        </div>
      </div>
    `;
    slidesEl.insertBefore(section, finalSlide);
  });

  const finalRow = document.getElementById("finalRow");
  members.forEach((m, i) => {
    const d = document.createElement("div");
    d.className = "final-photo";
    d.id = "final-" + i;
    d.style.background = gradientFor(i);
    d.innerHTML = avatarContentHTML(i);
    finalRow.appendChild(d);
  });

  const allSlides = Array.from(document.querySelectorAll(".slide"));
  const totalSlides = allSlides.length;
  let current = 0;
  let animating = false;
  let entranceLock = false;

  function typeText(el, text, speed) {
    speed = speed || 42;
    return new Promise((resolve) => {
      el.textContent = "";
      el.classList.add("typing");
      let i = 0;
      const timer = setInterval(() => {
        el.textContent += text[i];
        i++;
        if (i >= text.length) {
          clearInterval(timer);
          el.classList.remove("typing");
          resolve();
        }
      }, speed);
    });
  }

  const flashEl = document.getElementById("flashEffect");
  const tray = document.getElementById("tray");
  const prevBtn = document.getElementById("prevBtn");
  const nextBtn = document.getElementById("nextBtn");
  const dotsWrap = document.getElementById("dots");

  function sleep(ms) {
    return new Promise((res) => setTimeout(res, ms));
  }

  function triggerFlash() {
    flashEl.classList.remove("active");
    void flashEl.offsetWidth;
    flashEl.classList.add("active");
    setTimeout(() => {
      flashEl.classList.remove("active");
    }, 110);
  }

  allSlides.forEach((s, i) => {
    const dot = document.createElement("button");
    dot.className = "dot" + (i === 0 ? " active" : "");
    dot.setAttribute("aria-label", "Slide " + (i + 1));
    dot.addEventListener("click", () => goTo(i));
    dotsWrap.appendChild(dot);
  });
  function updateDots() {
    Array.from(dotsWrap.children).forEach((d, i) =>
      d.classList.toggle("active", i === current),
    );
  }
  function updateNavButtons() {
    const locked = animating || entranceLock;
    prevBtn.disabled = current === 0 || locked;
    nextBtn.disabled = current === totalSlides - 1 || locked;
    // Sembunyikan arrow di slide awal (logo), tampilkan di slide lain
    const isGroup = allSlides[current].dataset.type === "group";
    prevBtn.style.display = isGroup ? "none" : "flex";
    nextBtn.style.display = isGroup ? "none" : "flex";
  }

  function ensureTrayFor(memberIndex) {
    if (document.getElementById("tray-" + memberIndex)) return;
    const m = members[memberIndex];
    const el = document.createElement("div");
    el.className = "tray-avatar";
    el.id = "tray-" + memberIndex;
    el.style.background = gradientFor(memberIndex);
    el.innerHTML = avatarContentHTML(memberIndex);
    tray.appendChild(el);
    requestAnimationFrame(() => el.classList.add("show"));
  }

  async function goTo(targetIndex) {
    if (
      animating ||
      entranceLock ||
      targetIndex === current ||
      targetIndex < 0 ||
      targetIndex >= totalSlides
    )
      return;
    animating = true;
    updateNavButtons();

    const leavingSlide = allSlides[current];
    const forward = targetIndex > current;

    if (leavingSlide.dataset.type === "member") {
      ensureTrayFor(parseInt(leavingSlide.dataset.index, 10));
    }
    if (forward) {
      for (let i = current; i < targetIndex; i++) {
        if (allSlides[i].dataset.type === "member") {
          ensureTrayFor(parseInt(allSlides[i].dataset.index, 10));
        }
      }
    }

    allSlides[current].classList.remove("active");
    current = targetIndex;
    allSlides[current].classList.add("active");
    updateDots();

    const activeSlide = allSlides[current];
    animating = false;

    if (activeSlide.dataset.type === "member") {
      entranceLock = true;
      updateNavButtons();

      const idx = parseInt(activeSlide.dataset.index, 10);
      const avatar = activeSlide.querySelector(".member-avatar");
      const nameEl = document.getElementById("name-" + idx);
      const descEl = document.getElementById("desc-" + idx);

      descEl.classList.remove("show");
      nameEl.textContent = "";

      avatar.classList.remove("enter");
      void avatar.offsetWidth;
      avatar.classList.add("enter");

      await sleep(650);
      await typeText(nameEl, members[idx].name);

      triggerFlash();
      descEl.classList.add("show");

      await sleep(350);

      entranceLock = false;
    }

    if (activeSlide.dataset.type === "final") {
      runGatherAnimation();
    }

    updateNavButtons();
  }

  function runGatherAnimation() {
    members.forEach((m, i) => ensureTrayFor(i));

    const clones = [];
    members.forEach((m, i) => {
      const start = document.getElementById("tray-" + i);
      const end = document.getElementById("final-" + i);
      if (!start || !end) return;

      const sRect = start.getBoundingClientRect();
      const eRect = end.getBoundingClientRect();

      const clone = document.createElement("div");
      clone.className = "gather-clone";
      clone.style.background = gradientFor(i);
      clone.style.left = sRect.left + "px";
      clone.style.top = sRect.top + "px";
      clone.style.width = sRect.width + "px";
      clone.style.height = sRect.height + "px";
      clone.style.borderRadius = "10px";
      clone.innerHTML = avatarContentHTML(i);
      document.body.appendChild(clone);
      start.classList.add("hide-for-gather");

      clones.push({ clone, eRect, i });
    });

    requestAnimationFrame(() => {
      clones.forEach(({ clone, eRect, i }) => {
        clone.style.transition = `left .8s cubic-bezier(.2,.8,.25,1) ${i * 90}ms, top .8s cubic-bezier(.2,.8,.25,1) ${i * 90}ms, width .8s cubic-bezier(.2,.8,.25,1) ${i * 90}ms, height .8s cubic-bezier(.2,.8,.25,1) ${i * 90}ms, border-radius .8s ease ${i * 90}ms`;
        clone.style.left = eRect.left + "px";
        clone.style.top = eRect.top + "px";
        clone.style.width = eRect.width + "px";
        clone.style.height = eRect.height + "px";
        clone.style.borderRadius = "14px";
      });
    });

    const totalDelay = 800 + members.length * 90 + 150;
    setTimeout(() => {
      members.forEach((m, i) => {
        const end = document.getElementById("final-" + i);
        if (end) end.style.opacity = "1";
      });
      clones.forEach(({ clone }) => clone.remove());
    }, totalDelay);
  }

  document.getElementById("startBtn").addEventListener("click", () => goTo(1));
  prevBtn.addEventListener("click", () => goTo(current - 1));
  nextBtn.addEventListener("click", () => goTo(current + 1));

  document.addEventListener("keydown", (e) => {
    if (e.key === "ArrowRight") goTo(current + 1);
    if (e.key === "ArrowLeft") goTo(current - 1);
  });

  let touchStartX = null;
  document.addEventListener(
    "touchstart",
    (e) => (touchStartX = e.touches[0].clientX),
    { passive: true },
  );
  document.addEventListener(
    "touchend",
    (e) => {
      if (touchStartX === null) return;
      const dx = e.changedTouches[0].clientX - touchStartX;
      if (Math.abs(dx) > 60) {
        dx < 0 ? goTo(current + 1) : goTo(current - 1);
      }
      touchStartX = null;
    },
    { passive: true },
  );

  updateNavButtons();
})();
</script>
</body>
</html>
